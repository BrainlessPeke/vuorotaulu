<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vuorotaulun tarkastus on siirtynyt</title>
  <meta http-equiv="refresh" content="0; url=https://nrtyokalut.github.io/" />
  <link rel="canonical" href="https://nrtyokalut.github.io/" />
  <meta name="theme-color" content="#0B3D5C" />
  <link rel="icon" href="icons/icon-192.png" />
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0B3D5C; color: #fff; text-align: center; padding: 1.5rem; box-sizing: border-box; }
    a { color: #fff; font-weight: 600; font-size: 1.15rem; }
    p { opacity: .85; }
  </style>
  <script>
    // Poista vanhan osoitteen service worker ja välimuistit, sitten siirry uuteen osoitteeseen.
    (function () {
      var target = "https://nrtyokalut.github.io/";
      var tasks = [];
      try {
        if ("serviceWorker" in navigator) {
          tasks.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
        if (window.caches) {
          tasks.push(caches.keys().then(function (ks) {
            return Promise.all(ks.map(function (k) { return caches.delete(k); }));
          }));
        }
      } catch (e) {}
      var go = function () { location.replace(target); };
      setTimeout(go, 1500);
      Promise.all(tasks).then(go, go);
    })();
  </script>
</head>
<body>
  <main>
    <p><a href="https://nrtyokalut.github.io/">Sovellus on siirtynyt: nrtyokalut.github.io</a></p>
    <p>Jos olet lisännyt sovelluksen kotivalikkoon, lisää se uudelleen uudesta osoitteesta.</p>
  </main>
</body>
</html>
